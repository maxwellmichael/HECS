<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="556" height="267" viewBox="0 0 556 267" role="img" aria-labelledby="title desc">
  <title id="title">Emerson logo</title>
  <desc id="desc">Vector recreation of the four-colour Emerson logo.</desc>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#85898d"/>
      <stop offset=".48" stop-color="#d9dcde"/>
      <stop offset="1" stop-color="#aeb3b7"/>
    </linearGradient>
  </defs>
  <!-- Stylized striped emblem -->
  <g>
    <path fill="url(#silver)" d="M260 31 L276 50 L253 91 L238 73 Z"/>
    <path fill="url(#silver)" d="M280 54 L296 73 L273 114 L257 95 Z"/>
    <path fill="url(#silver)" d="M300 77 L315 96 L292 137 L277 118 Z"/>
    <path fill="url(#silver)" d="M320 100 L335 119 L312 160 L297 141 Z" transform="translate(-20 0)"/>
    <path fill="#064b91" d="M249 81 L274 94 L266 108 L241 95 Z"/>
    <path fill="#064b91" d="M269 104 L294 117 L286 131 L261 118 Z"/>
    <path fill="#064b91" d="M289 127 L314 140 L306 154 L281 141 Z"/>
  </g>
  <!-- Wordmark; text remains editable vector text -->
  <text x="35" y="231" fill="#064b91"
        font-family="Arial, Helvetica, sans-serif"
        font-size="75" font-weight="800" letter-spacing="1.1"
        textLength="462" lengthAdjust="spacingAndGlyphs">EMERSON</text>
  <text x="503" y="231" fill="#064b91"
        font-family="Arial, Helvetica, sans-serif"
        font-size="10" font-weight="700">™</text>
